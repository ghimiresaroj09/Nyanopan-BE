          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - old_password
    GeneratedVariantAttributeRequest:
      type: object
      properties:
        attributeId:
          type: string
