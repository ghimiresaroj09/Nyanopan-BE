openapi: 3.0.3
info:
  title: Ecommerce Shop API
  version: 1.0.0
  description: 'Public catalog APIs and admin management APIs for a WhatsApp-checkout
    ecommerce shop. There is no customer authentication: shoppers browse the public
    catalog and check out via WhatsApp on the frontend. Admin product creation is
    a 3-step flow: Product 1/3 adds the product info, Product 2/3 adds the attributes,
    values and prices, and Product 3/3 adds the images.'
paths:
  /api/v1/admin/attribute-values/:
    get:
      operationId: admin_attribute_values_list
      description: |-
        Wrap 2xx responses in the success envelope.

        ``use_status_envelope = True`` switches a view to the status envelope
        (``{status, message, statusCode, data}``); the default stays legacy.
      parameters:
      - in: query
        name: attribute
        schema:
          type: string
          format: uuid
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Admin - Attribute Values
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Retrieved successfully.
                  data:
                    $ref: '#/components/schemas/PaginatedAttributeValueAdminList'
                required:
                - success
                - message
                - data
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Permission denied.
    post:
      operationId: admin_attribute_values_create
      description: 'Create one attribute value (`{attribute, name}`) or many at once
        (`{attribute, value: [...]}`); the bulk shape is identical to POST .../attribute-values/bulk/.'
      tags:
      - Admin - Attribute Values
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeValueAdminRequest'
            examples:
              SingleValue:
                value:
                  attribute: Color
                  name: Red
                summary: Single value
              BulkValues:
                value:
                  attribute: Color
                  value:
                  - Red
                  - Black
                  - Blue
                summary: Bulk values
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttributeValueAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttributeValueAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Created successfully.
                  data:
                    $ref: '#/components/schemas/AttributeValueAdmin'
                required:
                - success
                - message
                - data
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required.
        '403':
