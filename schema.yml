    post:
      operationId: admin_products_create
      description: 'Step 1 of the product flow: create the product with its info (name,
        category, model, description). Nested values/variants are also accepted here,
        but the guided flow adds them in step 2 using the returned product id. Send
        application/json with image slots as {url|name|public_id, ...} objects multipart/form-data:
        nested attribute_values/variants/key_features go in as JSON-encoded strings,
        files as parts, and image slots reference them via {"file": "<part-name>"}.
        Example: -F attribute_values=''[{"key": "grey", "attribute": "<uuid>", "attribute_value":
        "<uuid>", "feature_image": {"file": "grey-img"}}]'' -F grey-img=@grey.png
        References accept UUIDs or human keys: category/model/product slugs, attribute
        names, value names (resolved within the attribute), and variant SKUs. Image
        slots also accept inline uploads in JSON via {"file": "data:image/...;base64,..."}.'
      summary: 'Step 1: Add product info'
      tags:
      - Product 1/3 - Info
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAdminWriteRequest'
            examples:
              ProductWithNestedValuesAndVariants:
                value:
                  name: Celsi Wool Felt Slippers
                  model: celsi
                  gender: UNISEX
                  description: Warm wool felt slippers.
                  category: slippers
                  is_featured: true
                  key_features:
                  - title: Sole
                    value: Rubber
                  attribute_values:
                  - key: grey
                    attribute: Color
                    attribute_value: Grey
                    feature_image:
                      public_id: shop/grey-main
                      title: Grey
                      alt: Grey slippers
                  - key: '40'
                    attribute: Size
                    attribute_value: '40'
                  variants:
                  - price: '5995.00'
                    options:
                    - key: grey
                    - key: '40'
                summary: Product with nested values and variants
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductMultipartRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Product created successfully.
                  statusCode:
                    type: integer
                    example: 201
                  data:
                    $ref: '#/components/schemas/ProductAdminResponse'
                required:
                - status
                - message
                - statusCode
                - data
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Permission denied.
