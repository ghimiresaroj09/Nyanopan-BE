components:
  schemas:
    AdminLoginResponse:
      type: object
      description: JWT pair plus the admin profile returned by the login endpoint.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/AdminUser'
      required:
      - access
      - refresh
      - user
    AdminTokenObtainPairRequest:
      type: object
      description: 'Login serializer: only staff users may obtain tokens.'
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    AdminTokenRefreshResponse:
      type: object
      description: Fresh access token returned by the refresh endpoint.
      properties:
        access:
          type: string
      required:
      - access
    AdminUser:
      type: object
      description: Safe admin representation. Never exposes password hashes.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - first_name
      - id
      - is_active
      - is_staff
      - last_name
    AttributeAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        requires_image:
          type: boolean
          description: When enabled, active product values of this attribute require
            a feature image.
        is_active:
          type: boolean
        values_count:
          type: integer
          readOnly: true
          default: 0
        values:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
      - values
      - values_count
    AttributeAdminRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        requires_image:
          type: boolean
          description: When enabled, active product values of this attribute require
            a feature image.
        is_active:
          type: boolean
        value:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          writeOnly: true
          description: Value names to create with the attribute (all-or-nothing on
            create), or ensure exist on update (existing names are left untouched).
          maxItems: 200
      required:
      - name
    AttributePublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        requires_image:
          type: boolean
          description: When enabled, active product values of this attribute require
            a feature image.
        values:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValuePublic'
          readOnly: true
      required:
      - id
      - name
      - values
    AttributeValueAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        attribute:
          type: string
          format: uuid
          description: Attribute UUID or name.
        attribute_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attribute
      - attribute_name
      - created_at
      - id
      - name
      - updated_at
    AttributeValueAdminRequest:
      type: object
      properties:
        attribute:
          type: string
          format: uuid
          description: Attribute UUID or name.
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
      required:
      - attribute
      - name
    AttributeValueBulkCreateRequest:
      type: object
      description: 'Bulk input: {"attribute": "<uuid or name>", "value": ["One", "Two",
        ...]}.'
      properties:
        attribute:
          type: string
          format: uuid
          description: Attribute UUID or name.
        value:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 200
          minItems: 1
      required:
      - attribute
      - value
    AttributeValuePublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    CategoryAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        image:
          type: object
          nullable: true
          description: Single image. Responses return the delivery URL plus metadata;
            requests reference an existing asset with url, name, or public_id (or
            a file marker in multipart writes), or null to clear.
          properties:
            url:
              type: string
              format: uri
              description: Delivery URL (responses); accepted in requests to reference
                that asset.
              example: https://res.cloudinary.com/demo/image/upload/v1/shop/grey-main.jpg
            public_id:
              type: string
              description: Stored asset name. Returned in responses; accepted in requests
                for round-trips.
              example: shop/grey-main
            name:
              type: string
              writeOnly: true
              description: 'Request-only alias of public_id: reference an existing
                asset by name.'
              example: shop/grey-main
            file:
              type: string
              writeOnly: true
              description: 'Request-only image source: the name of a multipart file
                part holding the binary (top-level multipart sends the binary itself),
                or a ''data:image/...;base64,...'' URI to upload the image inline
                inside a JSON request.'
              example: grey-img
            title:
              type: string
              example: Grey Celsi Slippers
            caption:
              type: string
              example: Grey wool felt slippers
            alt:
              type: string
              example: Grey slippers
        product_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - product_count
      - updated_at
    CategoryAdminRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        image:
          type: object
          nullable: true
          description: Single image. Responses return the delivery URL plus metadata;
            requests reference an existing asset with url, name, or public_id (or
            a file marker in multipart writes), or null to clear.
          properties:
            url:
              type: string
              format: uri
              description: Delivery URL (responses); accepted in requests to reference
                that asset.
              example: https://res.cloudinary.com/demo/image/upload/v1/shop/grey-main.jpg
            public_id:
              type: string
              description: Stored asset name. Returned in responses; accepted in requests
                for round-trips.
              example: shop/grey-main
            name:
              type: string
              writeOnly: true
              description: 'Request-only alias of public_id: reference an existing
                asset by name.'
              example: shop/grey-main
            file:
              type: string
              writeOnly: true
              description: 'Request-only image source: the name of a multipart file
                part holding the binary (top-level multipart sends the binary itself),
                or a ''data:image/...;base64,...'' URI to upload the image inline
                inside a JSON request.'
              example: grey-img
            title:
              type: string
              example: Grey Celsi Slippers
            caption:
              type: string
              example: Grey wool felt slippers
            alt:
              type: string
              example: Grey slippers
      required:
      - name
    CategoryMultipartRequest:
      type: object
      description: Binary-file request shape for multipart category writes (OpenAPI
        docs).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        image:
          type: string
          format: binary
          nullable: true
          description: Binary image file. Omit to keep the current image, null to
            clear it.
      required:
      - name
    CategoryNested:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
    CategoryObject:
      type: object
      description: Nested category object for product responses (note the camelCase
        flag).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        isActive:
          type: boolean
          readOnly: true
      required:
      - id
      - isActive
      - name
    CategoryPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        image:
          type: object
          nullable: true
          description: Single image (public payloads omit the internal asset name).
          properties:
            url:
              type: string
              format: uri
              example: https://res.cloudinary.com/demo/image/upload/v1/shop/grey-main.jpg
            title:
              type: string
              example: Grey Celsi Slippers
            caption:
              type: string
              example: Grey wool felt slippers
            alt:
              type: string
              example: Grey slippers
          readOnly: true
        product_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - id
      - image
      - name
      - product_count
    ChangePasswordRequest:
      type: object
