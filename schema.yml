          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        name:
          type: string
          maxLength: 200
        is_special_edition:
          type: boolean
        is_active:
          type: boolean
        options:
          type: array
          items:
            description: 'Variant-option reference: an existing value UUID, a temporary
              key created in the same request, or an explicit {id} / {key} object.'
            oneOf:
            - type: string
              format: uuid
              example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            - type: string
              example: grey
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                key:
                  type: string
              example:
                key: grey
    VariantOptionAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant:
          type: string
          format: uuid
          description: Variant UUID or SKU.
        variant_sku:
          type: string
          readOnly: true
        product_attribute_value:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product_attribute_value
      - variant
      - variant_sku
    VariantOptionAdminRequest:
      type: object
      properties:
        variant:
          type: string
          format: uuid
          description: Variant UUID or SKU.
        product_attribute_value:
          type: string
          format: uuid
      required:
      - product_attribute_value
      - variant
    VariantOptionDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product_attribute_value:
          type: string
          format: uuid
        attribute:
          type: string
          readOnly: true
        value:
          type: string
          readOnly: true
      required:
      - attribute
      - id
      - product_attribute_value
      - value
    VariantPaletteEcho:
      type: object
      properties:
        attribute:
          allOf:
          - $ref: '#/components/schemas/VariantValueAttributeObject'
          readOnly: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/VariantValueOptionObject'
          readOnly: true
      required:
      - attribute
      - options
    VariantPaletteEntryRequest:
      type: object
      properties:
        attribute:
          type: string
          format: uuid
        options:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required:
      - attribute
      - options
    VariantValueAttributeObject:
      type: object
      properties:
        object:
          type: string
          example: attribute
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        isActive:
          type: boolean
          readOnly: true
        created_date:
          type: string
          format: date-time
          example: '2026-09-17T10:00:00.000Z'
          readOnly: true
        updated_date:
          type: string
          format: date-time
          example: '2026-09-17T10:00:00.000Z'
          readOnly: true
      required:
      - created_date
      - id
      - isActive
      - name
      - object
      - updated_date
    VariantValueOptionObject:
      type: object
      properties:
        object:
          type: string
          example: attributevalueitem
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - object
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed.
        errors:
          type: object
          description: Field errors (or non_field_errors/detail).
          example:
            name:
            - This field is required.
      required:
      - success
      - message
      - errors
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
