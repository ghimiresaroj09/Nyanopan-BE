  /api/v1/internal/cron/{job}/:
    get:
      operationId: internal_cron_retrieve
      description: Entry point for the external scheduler (cron-job.org). The shared
        secret must be sent in the `X-Cron-Secret` header — query parameters are deliberately
        not accepted, because access logs record the full request line and would leak
        the secret. Answers `503` while no `CRON_SECRET` is configured (fail closed),
        `403` on a missing or wrong secret, and `404` for an unregistered job name.
        `GET` and `POST` behave identically so either can be configured in the scheduler.
      summary: Run a scheduled maintenance job
      parameters:
      - in: path
        name: job
        schema:
          type: string
        description: 'Registered job name: `tokens` (delete expired JWT rows) or `sessions`
          (delete expired admin sessions).'
        required: true
      tags:
      - Internal
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Cron job 'tokens' completed.
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    additionalProperties: {}
                required:
                - status
                - message
                - statusCode
                - data
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation failed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing or invalid X-Cron-Secret header.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Cron endpoints disabled: CRON_SECRET is not configured.'
