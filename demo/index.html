<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Admin — Demo Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">W</span>
      <div>
        <div class="brand-name">White Admin</div>
        <div class="brand-sub">Super admin demo</div>
      </div>
    </div>
    <nav id="nav" class="nav">
      <button data-route="dashboard" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </button>
      <button data-route="currencies" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.7-1-1.7-1.5-2.9-1.5-1.8 0-3 1-3 2.5 0 3.5 6.3 1.5 6.3 5 0 1.5-1.3 2.5-3 2.5-1.3 0-2.4-.6-3-1.6M12 6v12"/></svg>
        <span>Currencies</span>
      </button>
      <button data-route="categories" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        <span>Categories</span>
      </button>
      <button data-route="models" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
        <span>Product Models</span>
      </button>
      <button data-route="attributes" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#fff"/><circle cx="15" cy="12" r="2" fill="#fff"/><circle cx="7" cy="18" r="2" fill="#fff"/></svg>
        <span>Attributes</span>
      </button>
      <button data-route="values" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
        <span>Attribute Values</span>
      </button>
      <button data-route="products" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Products</span>
      </button>
    </nav>
    <div class="side-foot">
      <div class="storage-pill" id="storagePill" title="All data persists in browser localStorage">
        <span class="dot"></span><span id="storageText">localStorage ready</span>
      </div>
      <button class="btn btn-block" id="resetBtn">Reset demo data</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-right" id="topbarActions"></div>
    </header>
    <main id="content" class="content"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
