name: Keep the Render instance warm (manual fallback)

# The deployment is kept warm by cron-job.org — see the README section
# "Keeping the free instance warm". This workflow is a MANUAL fallback only:
# it is not scheduled, because a GitHub Actions cron would double up on the
# pinger and burn Actions minutes (a 10-minute schedule is ~4,300 runs/month).
#
# If you ever want to use it instead of cron-job.org, uncomment the `schedule`
# block below. Note the GitHub caveats: scheduled workflows only run on the
# default branch, runs are delayed under load, and the schedule is disabled
# after 60 days without repository activity.
#
# It pings /api/health/live/ (process-only) and NOT /api/health/ (which runs
# `SELECT 1`): keeping the Neon database awake around the clock would burn its
# monthly free compute allowance, and Neon resumes from a suspend in
# milliseconds anyway.

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: {} # run manually from the Actions tab

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping liveness endpoint
        env:
          # Override without editing this file:
          #   Settings -> Secrets and variables -> Actions -> Variables
          #   SERVICE_URL = https://your-service.onrender.com
          SERVICE_URL: ${{ vars.SERVICE_URL || 'https://ecommerce-api.onrender.com' }}
        run: |
          set -euo pipefail
          url="${SERVICE_URL%/}/api/health/live/"
          echo "Pinging $url"
          body=$(mktemp)
          # --max-time 120 covers a cold start (~1 min) on a spun-down instance.
          code=$(curl -sS -o "$body" -w '%{http_code}' \
                   --max-time 120 --retry 2 --retry-delay 15 "$url")
          echo "HTTP $code $(cat "$body")"
          test "$code" = "200"
